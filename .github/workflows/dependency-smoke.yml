name: Dependency smoke tests

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Dependency smoke tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CI: 'true'

    steps:
      - name: Check out PR merge commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use production Node version
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      # Use the checked-in Yarn release without relying on runner/Corepack defaults.
      - name: Install dependencies from lockfile
        run: node .yarn/releases/yarn-4.14.1.cjs install --immutable

      - name: Verify the installed Nuxt runtime requirements
        run: node ci/dependency-runtime.mjs check-installed

      - name: Run smoke harness unit tests
        run: node .yarn/releases/yarn-4.14.1.cjs test:smoke:unit

      - name: Run dependency automation regression tests
        run: node .yarn/releases/yarn-4.14.1.cjs test:dependencies

      - name: Install Chromium and Linux dependencies
        run: node .yarn/releases/yarn-4.14.1.cjs playwright install --with-deps chromium

      - name: Record runtime and browser diagnostics
        run: node .yarn/releases/yarn-4.14.1.cjs test:smoke:diagnostics

      - name: Lint, build and test production homepage
        run: node .yarn/releases/yarn-4.14.1.cjs test:smoke

      - name: Upload smoke logs and browser reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dependency-smoke-results
          path: smoke-results/
          if-no-files-found: ignore
          retention-days: 7
