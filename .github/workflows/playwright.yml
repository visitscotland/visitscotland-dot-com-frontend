name: Playwright Tests

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: playwright-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

env:
  YARN_ENABLE_GLOBAL_CACHE: 'false'

jobs:
  # Skip the test suite if the author is dependabot or github actions
  classify:
    name: Classify visual coverage
    runs-on: ubuntu-latest
    outputs:
      exempt: ${{ steps.policy.outputs.exempt }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        id: policy
        with:
          script: |
            const pr = context.payload.pull_request;
            let exempt = false;
            if (pr) {
              const files = await github.paginate(github.rest.pulls.listFiles, {
                ...context.repo, pull_number: pr.number, per_page: 100,
              });
              const policy = require('./.github/visual-pr-policy.cjs');
              // Fail closed if the API did not return the full PR diff.
              exempt = files.length === pr.changed_files && policy(pr.user.login, files);
            }
            core.setOutput('exempt', String(exempt));
            await core.summary.addHeading('Visual test policy')
              .addRaw(exempt
                ? 'Exempt: approved automation author; only package.json/yarn.lock changed.'
                : 'Run the fixture-driven desktop visual suite.').write();

  test:
    name: Playwright and Chromatic
    needs: classify
    if: needs.classify.outputs.exempt != 'true'
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --init --ipc=host
    env:
      HOME: /root
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Trust the mounted workspace in the container
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git --no-pager log -1 --format=%H
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - run: corepack enable
      - run: node --test .github/visual-pr-policy.test.cjs
      - name: Restore Yarn downloads
        id: yarn-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .yarn/cache
          key: yarn-${{ runner.os }}-node24-v1-${{ hashFiles('yarn.lock', '.yarnrc.yml') }}
          restore-keys: |
            yarn-${{ runner.os }}-node24-v1-
      - run: yarn install --immutable
      - name: Save Yarn downloads before tests
        if: steps.yarn-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .yarn/cache
          key: ${{ steps.yarn-cache.outputs.cache-primary-key }}
      - name: Assert rendering and capture Chromatic archives
        run: yarn playwright test
        env:
          PW_PROJECT: visitscotland-dot-com
          CHROMATIC_CAPTURE: 'true'
      - name: Preserve reports and captures
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: warn
      - name: Check project token
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          CHROMATIC_PROJECT_TOKEN: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
        run: |
          if [ -z "$CHROMATIC_PROJECT_TOKEN" ]; then
            echo '::error::Configure the CHROMATIC_PROJECT_TOKEN repository secret for this project.'
            exit 1
          fi
      - name: Compare captured pages
        id: chromatic
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: chromaui/action@6ac4c49524e1b1358b8c593c5eea877604228268 # v18.14.2
        with:
          playwright: true
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          exitZeroOnChanges: false
          branchName: ${{ github.head_ref || github.ref_name }}
        env:
          CHROMATIC_ARCHIVE_LOCATION: test-results
      - name: Link to Chromatic visual review
        if: ${{ !cancelled() && steps.chromatic.outputs.buildUrl != '' }}
        env:
          CHROMATIC_BUILD_URL: ${{ steps.chromatic.outputs.buildUrl }}
        run: |
          printf '### Chromatic visual review\n\n[Review and accept or reject visual changes](%s)\n' "$CHROMATIC_BUILD_URL" >> "$GITHUB_STEP_SUMMARY"

  chromatic:
    name: Report visual exemption
    needs: classify
    if: >-
      !cancelled() && needs.classify.result == 'success' &&
      needs.classify.outputs.exempt == 'true' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CHROMATIC_PROJECT_TOKEN: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
      CHROMATIC_BRANCH: ${{ github.head_ref || github.ref_name }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Check project token
        run: |
          if [ -z "$CHROMATIC_PROJECT_TOKEN" ]; then
            echo '::error::Configure the CHROMATIC_PROJECT_TOKEN repository secret for this project.'
            exit 1
          fi
      - name: Mark exempt PR as skipped in Chromatic
        uses: chromaui/action@6ac4c49524e1b1358b8c593c5eea877604228268 # v18.14.2
        with:
          skip: true
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          branchName: ${{ github.head_ref || github.ref_name }}
