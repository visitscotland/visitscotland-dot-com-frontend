name: Playwright Tests

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

# Pilot only: no branch protection requirements are added.
concurrency:
  group: playwright-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  classify:
    name: Classify visual coverage
    runs-on: ubuntu-latest
    outputs:
      exempt: ${{ steps.policy.outputs.exempt }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        id: policy
        with:
          script: |
            const pr = context.payload.pull_request;
            let exempt = false;
            if (pr) {
              const files = await github.paginate(github.rest.pulls.listFiles, {
                ...context.repo, pull_number: pr.number, per_page: 100,
              });
              const policy = require('./.github/visual-pr-policy.cjs');
              // Fail closed if the API did not return the full PR diff.
              exempt = files.length === pr.changed_files && policy(pr.user.login, files);
            }
            core.setOutput('exempt', String(exempt));
            await core.summary.addHeading('Visual test policy')
              .addRaw(exempt
                ? 'Exempt: approved automation author; only package.json/yarn.lock changed.'
                : 'Run the fixture-driven desktop visual suite.').write();

  test:
    name: Playwright rendering and capture
    needs: classify
    if: needs.classify.outputs.exempt != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - run: corepack enable
      - run: node --test .github/visual-pr-policy.test.cjs
      - run: yarn install --immutable
      - run: yarn playwright install chromium --with-deps
      - name: Assert rendering and capture Chromatic archives
        run: yarn playwright test
        env:
          PW_PROJECT: visitscotland-dot-com
          CHROMATIC_CAPTURE: 'true'
      - name: Preserve reports and captures
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: warn

  chromatic:
    name: Chromatic visual comparison
    needs: [classify, test]
    if: >-
      !cancelled() && needs.classify.result == 'success' &&
      (needs.test.result == 'success' || needs.classify.outputs.exempt == 'true') &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CHROMATIC_PROJECT_TOKEN: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
      CHROMATIC_BRANCH: ${{ github.head_ref || github.ref_name }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Check project token
        run: |
          if [ -z "$CHROMATIC_PROJECT_TOKEN" ]; then
            echo '::error::Configure the CHROMATIC_PROJECT_TOKEN repository secret for this project.'
            exit 1
          fi
      - name: Download captures
        if: needs.classify.outputs.exempt != 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: playwright-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: visual-results
      - name: Enable project package manager
        if: needs.classify.outputs.exempt != 'true'
        run: corepack enable
      - name: Install archive tooling
        if: needs.classify.outputs.exempt != 'true'
        run: yarn install --immutable
      - name: Mark exempt PR as skipped in Chromatic
        if: needs.classify.outputs.exempt == 'true'
        run: npx --yes chromatic@18.13.6 --skip --branch-name "$CHROMATIC_BRANCH"
      - name: Compare captured pages
        if: needs.classify.outputs.exempt != 'true'
        run: yarn chromatic:upload --playwright --exit-zero-on-changes --branch-name "$CHROMATIC_BRANCH"
        env:
          CHROMATIC_ARCHIVE_LOCATION: visual-results/test-results
